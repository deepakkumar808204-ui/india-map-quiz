<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>India Map Quiz</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #172033;
        }

        .header {
            background: #ffffff;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .flag {
            font-size: 45px;
        }

        h1 {
            margin: 8px 0 4px;
            font-size: 28px;
        }

        .subtitle {
            color: #667085;
            margin: 0;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 25px 18px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
        }

        .category {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            background: #eef2f7;
            color: #172033;
        }

        button:active {
            transform: scale(0.97);
        }

        .start {
            width: 100%;
            background: #1d7a46;
            color: white;
            margin-top: 20px;
        }

        .footer {
            text-align: center;
            color: #98a2b3;
            font-size: 13px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <div class="header">

        <div class="flag">🇮🇳</div>

        <h1>India Map Quiz</h1>

        <p class="subtitle">
            UPSC Geography Practice
        </p>

    </div>


    <div class="container">

        <div class="card">

            <h2>Choose a category</h2>

            <div class="category">

                <button>🇮🇳 States</button>

                <button>🌊 Rivers</button>

                <button>⛰️ Mountains</button>

                <button>🏔️ Passes</button>

                <button>🐅 Tiger Reserves</button>

                <button>🌿 Ramsar Sites</button>

            </div>

            <button class="start">
                START QUIZ
            </button>

        </div>


        <div class="card">

            <h2>Coming Soon</h2>

            <p>🎯 Training Mode</p>
            <p>⏱️ Timed Quiz</p>
            <p>🏆 Score & Streaks</p>
            <p>📚 UPSC Current Affairs</p>

        </div>


        <div class="footer">

            India Map Quiz • UPSC Preparation

        </div>

    </div>

</body>
</html>
