<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>India Map Quiz - UPSC</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #172033;
}

.header {
    background: white;
    padding: 18px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.header h1 {
    margin: 0;
    font-size: 26px;
}

.header p {
    margin: 6px 0 0;
    color: #666;
}

.menu {
    display: flex;
    gap: 8px;
    padding: 12px;
    overflow-x: auto;
    background: white;
}

.menu button {
    border: none;
    padding: 10px 16px;
    border-radius: 20px;
    background: #e9eef5;
    font-weight: bold;
    white-space: nowrap;
}

.menu button.active {
    background: #172033;
    color: white;
}

#map {
    height: 65vh;
    width: 100%;
}

.info {
    background: white;
    padding: 15px;
    text-align: center;
}

.info h2 {
    margin: 5px 0;
}

.info p {
    margin: 5px 0;
    color: #666;
}

</style>
</head>

<body>

<div class="header">
    <h1>🇮🇳 India Map Quiz</h1>
    <p>UPSC Geography Practice</p>
</div>

<div class="menu">

    <button class="active">States & UTs</button>
    <button>Rivers</button>
    <button>Mountains</button>
    <button>Passes</button>
    <button>Tiger Reserves</button>
    <button>Ramsar Sites</button>

</div>

<div id="map"></div>

<div class="info">
    <h2>India Geography Quiz</h2>
    <p>Tap an area on the map to explore it.</p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([22.5, 79], 5);

L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

fetch('INDIA_STATES.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {

            style: {
                color: '#172033',
                weight: 1,
                fillColor: '#dce6f2',
                fillOpacity: 0.7
            },

            onEachFeature: function(feature, layer) {

                layer.on({

                    mouseover: function(e) {
                        e.target.setStyle({
                            weight: 2,
                            fillOpacity: 0.9
                        });
                    },

                    mouseout: function(e) {
                        e.target.setStyle({
                            weight: 1,
                            fillOpacity: 0.7
                        });
                    },

                    click: function() {

                        let name = feature.properties.STATE || "Selected area";

                        alert("You selected: " + name);

                    }

                });

            }

        }).addTo(map);

    })

    .catch(error => {
        console.log(error);
        alert("Map data could not be loaded.");
    });

</script>

</body>
</html>
